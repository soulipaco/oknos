[project]
name = "greek-coach"
version = "0.1.0"
description = "A local-first Greek learning app that your coding agent installs, runs and extends."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
greek-coach = "greek_coach.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# Only the coach needs this, to transcribe speaking recordings locally (SPEC §9):
#   uv run --group speech greek-coach transcribe
speech = [
    "faster-whisper>=1.1",
    # faster-whisper 1.2 passes `metadata_errors` to av.open(), which av 17+ rejects (found 2026-11-16).
    "av>=16,<17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
