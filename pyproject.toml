[project]
name = "oknos"
version = "0.1.0"
description = "A local-first Greek learning app that your coding agent installs, runs and extends."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Microsoft's free neural voices, made into clips on the learner's own machine (docs/VOICE.md).
    "edge-tts>=7",
]

[project.scripts]
oknos = "oknos.cli:main"
# The old name, until the shortcut and scheduled runs made before the rename are re-made.
greek-coach = "oknos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# Only the coach needs this, to transcribe speaking recordings locally (SPEC §9):
#   uv run --group speech oknos transcribe
speech = [
    "faster-whisper>=1.1",
    # faster-whisper 1.2 passes `metadata_errors` to av.open(), which av 17+ rejects (found 2026-11-16).
    "av>=16,<17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oknos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
